server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routes (e.g. /events, /admin) have no
    # matching file on disk, so let React Router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Long-cache hashed build assets; index.html itself stays uncached so
    # a new deploy is picked up immediately instead of being served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
