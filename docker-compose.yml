services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventify
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Back-end
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: local-dev-only
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://eventify:eventify@db:5432/eventify
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Front-end
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
