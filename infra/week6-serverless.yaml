AWSTemplateFormatVersion: '2010-09-09'
Description: Eventify Week 6 - Lambda reminders, API Gateway, EventBridge Scheduler and X-Ray.

Parameters:
  LambdaImageUri: {Type: String}
  EcsClusterArn: {Type: String}
  EcsTaskDefinitionArn: {Type: String}
  EcsSubnets: {Type: String}
  EcsSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  EcsExecutionRoleArn: {Type: String}
  EcsTaskRoleArn: {Type: String}

Resources:
  ReminderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: LaunchReminderTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecs:RunTask', Resource: !Ref EcsTaskDefinitionArn}
              - {Effect: Allow, Action: 'ecs:DescribeTasks', Resource: '*'}
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: [!Ref EcsExecutionRoleArn, !Ref EcsTaskRoleArn]
  ReminderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: event-mgmt-reminders
      PackageType: Image
      Code: {ImageUri: !Ref LambdaImageUri}
      Role: !GetAtt ReminderRole.Arn
      MemorySize: 512
      Timeout: 120
      TracingConfig: {Mode: Active}
      Environment:
        Variables:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: week6-lambda-runtime
          DJANGO_ALLOWED_HOSTS: '*'
          AWS_XRAY_ENABLED: 'True'
          ECS_CLUSTER: !Ref EcsClusterArn
          REMINDER_TASK_DEFINITION: !Ref EcsTaskDefinitionArn
          ECS_SUBNETS: !Ref EcsSubnets
          ECS_SECURITY_GROUP: !Ref EcsSecurityGroupId
  ReminderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/event-mgmt-reminders, RetentionInDays: 14}
  ReminderApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: event-mgmt-reminders, ProtocolType: HTTP}
  ReminderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ReminderApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReminderFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
  ReminderRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReminderApi
      RouteKey: POST /reminders
      AuthorizationType: AWS_IAM
      Target: !Join ['/', [integrations, !Ref ReminderIntegration]]
  ReminderStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: {ApiId: !Ref ReminderApi, StageName: '$default', AutoDeploy: true}
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReminderFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ReminderApi}/*/POST/reminders'
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: scheduler.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: InvokeReminderLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt ReminderFunction.Arn}]
  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: event-mgmt-lambda-reminders
      ScheduleExpression: rate(1 hour)
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt ReminderFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"hours":24}'
        RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 2}
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: event-mgmt-lambda-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ReminderFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: event-mgmt-lambda-duration
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: !Ref ReminderFunction}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionName: {Value: !Ref ReminderFunction}
  ApiEndpoint: {Value: !Sub '${ReminderApi.ApiEndpoint}/reminders'}
  ScheduleName: {Value: !Ref ReminderSchedule}
